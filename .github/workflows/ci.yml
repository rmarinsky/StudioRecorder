name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Install secret scan tools
        run: brew bundle
      - name: Check secret guard behavior
        run: ./scripts/check-secrets.test.sh
      - name: Check repository for secrets
        run: ./scripts/check-secrets.sh ci
      - name: Select Xcode 26.5
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml --project .
      - name: Build and test
        run: >-
          xcodebuild
          -project StudioRecorder.xcodeproj
          -scheme StudioRecorder
          -destination 'platform=macOS,arch=arm64'
          test
          CODE_SIGNING_ALLOWED=NO
