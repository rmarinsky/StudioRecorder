name: StudioRecorder
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    exactVersion: 2.2.5
targets:
  StudioRecorder:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: StudioRecorder
        excludes:
          - Resources/Whisper/README.md
      - path: StudioRecorder/Resources/Whisper/whisper-cli
        buildPhase:
          copyFiles:
            destination: executables
            subpath: ""
      - path: Domain
      - path: Recording
    info:
      path: StudioRecorder/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Studio Recorder will use your camera for an optional camera track.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Studio Recorder connects to Ollama on this Mac when you choose a local assistant model.
        GoogleOAuthClientID: $(GOOGLE_OAUTH_CLIENT_ID)
        GoogleOAuthClientSecret: $(GOOGLE_OAUTH_CLIENT_SECRET)
        NSMicrophoneUsageDescription: Studio Recorder records your selected microphone as part of the primary raw capture.
        NSScreenCaptureUsageDescription: Studio Recorder records the displays you select into editable tracks or a composed program movie.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.com.rmarinsky.studiorecorder
        PRODUCT_NAME: Studio Recorder
        PRODUCT_MODULE_NAME: StudioRecorder
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: StudioRecorder/Resources/StudioRecorder.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
  StudioRecorderTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: StudioRecorderTests
    dependencies:
      - target: StudioRecorder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.com.rmarinsky.studiorecorder.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Studio Recorder.app/Contents/MacOS/Studio Recorder"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  StudioRecorder:
    build:
      targets:
        StudioRecorder: all
        StudioRecorderTests: [test]
    test:
      targets:
        - StudioRecorderTests
